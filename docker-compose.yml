services:
  db:
    image: postgres:16
    container_name: archive233_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: archive233
      POSTGRES_USER: archive233
      POSTGRES_PASSWORD: archive233_dev_only
    ports:
      - "5432:5432"
    volumes:
      - archive233_pgdata:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive233 -d archive233"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  archive233_pgdata:
