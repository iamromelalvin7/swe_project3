spring.application.name=backend

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
# Supavisor's transaction-mode pooler doesn't preserve prepared statements
# across pooled connections; PRD risk #6 names this exact mitigation.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Lazy beans shorten cold starts on Render's free tier. Required settings are
# still checked at boot by config/StartupConfigValidator (an eager bean).
spring.main.lazy-initialization=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:24}

app.supabase.url=${SUPABASE_URL}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.supabase.bucket=${SUPABASE_BUCKET:product-images}

app.cart.hold-minutes=${CART_HOLD_MINUTES:10}
app.cart.sweeper.interval-ms=60000

app.rate-limit.auth.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
app.rate-limit.auth.window-minutes=${AUTH_RATE_LIMIT_WINDOW_MINUTES:15}
app.rate-limit.checkout.max-attempts=${CHECKOUT_RATE_LIMIT_MAX_ATTEMPTS:10}
app.rate-limit.checkout.window-minutes=${CHECKOUT_RATE_LIMIT_WINDOW_MINUTES:15}

# Session cookie. Secure must stay true in production (HTTPS); browsers also
# accept Secure cookies on http://localhost, so it can stay true locally too.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

# Shared secret the frontend's proxy sends so this API can trust the
# shopper IP it forwards for rate limiting (see auth/ClientIpResolver).
# Must match the frontend's PROXY_SHARED_SECRET. Optional: when unset, the
# last X-Forwarded-For hop is used instead.
app.proxy.shared-secret=${PROXY_SHARED_SECRET:}
# How many proxies in front of this app append to X-Forwarded-For: 1 on
# Render. Set 0 if the app is ever exposed directly (the header is then
# ignored, since a client could have written all of it).
app.proxy.trusted-hops=${TRUSTED_PROXY_HOPS:1}

app.paystack.secret-key=${PAYSTACK_SECRET_KEY}

app.frontend-url=${FRONTEND_URL}

app.resend.api-key=${RESEND_API_KEY}
app.resend.from=${RESEND_FROM_EMAIL}

app.email.verification-code-ttl-minutes=${EMAIL_VERIFICATION_TTL_MINUTES:15}
app.email.password-reset-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:60}
