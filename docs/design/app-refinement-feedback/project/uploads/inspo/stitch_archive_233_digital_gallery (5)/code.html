<body class="bg-background text-primary antialiased min-h-screen selection:bg-surface-variant selection:text-primary">
<!-- Suppressed TopNavBar & Footer due to Transactional/Checkout Intent -->
<main class="w-full max-w-screen-2xl mx-auto px-margin-mobile md:px-margin-desktop py-margin-desktop md:py-24">
<div class="flex flex-col lg:flex-row gap-gutter lg:gap-24 w-full">
<!-- Left Column: Form Canvas (60%) -->
<section class="w-full lg:w-3/5 flex flex-col gap-16">
<header>
<a class="inline-flex items-center gap-2 mb-12 hover:opacity-70 transition-opacity" href="#">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
<span class="font-metadata-label text-metadata-label uppercase">Return to Cart</span>
</a>
<h1 class="font-display-lg text-display-lg uppercase tracking-tight">Checkout</h1>
</header>
<form class="flex flex-col gap-12">
<!-- Contact & Shipping Details -->
<div class="flex flex-col gap-8">
<div class="flex flex-col gap-2 group">
<label class="font-metadata-label text-metadata-label text-secondary uppercase tracking-widest" for="full_name">Full Name</label>
<input class="w-full bg-transparent border-0 border-b border-hairline py-3 px-0 font-body-base text-body-base text-primary placeholder:text-outline-variant focus:ring-0 focus:border-primary transition-colors" id="full_name" name="full_name" placeholder="Enter your full name" type="text"/>
</div>
<div class="flex flex-col gap-2 group">
<label class="font-metadata-label text-metadata-label text-secondary uppercase tracking-widest" for="phone">Phone Number</label>
<input class="w-full bg-transparent border-0 border-b border-hairline py-3 px-0 font-body-base text-body-base text-primary placeholder:text-outline-variant focus:ring-0 focus:border-primary transition-colors" id="phone" name="phone" placeholder="+233" type="tel"/>
</div>
<div class="flex flex-col gap-2 group">
<label class="font-metadata-label text-metadata-label text-secondary uppercase tracking-widest" for="address">Delivery Address</label>
<textarea class="w-full bg-transparent border-0 border-b border-hairline py-3 px-0 font-body-base text-body-base text-primary placeholder:text-outline-variant focus:ring-0 focus:border-primary transition-colors resize-none" id="address" name="address" placeholder="Street address, building, floor..." rows="3"></textarea>
</div>
<div class="flex flex-col gap-2 group">
<label class="font-metadata-label text-metadata-label text-secondary uppercase tracking-widest" for="zone">Delivery Zone</label>
<select class="w-full bg-transparent border-0 border-b border-hairline py-3 px-0 pr-8 font-body-base text-body-base text-primary focus:ring-0 focus:border-primary transition-colors cursor-pointer" id="zone" name="zone">
<option class="text-outline-variant" disabled="" selected="" value="">Select zone</option>
<option value="accra_central">Accra Central</option>
<option value="east_legon">East Legon</option>
<option value="tema">Tema</option>
<option value="madina">Madina</option>
<option value="kumasi">Kumasi</option>
</select>
</div>
</div>
<!-- Payment Method Section -->
<div class="flex flex-col gap-6 pt-8 border-t border-hairline">
<h2 class="font-metadata-label text-metadata-label text-secondary uppercase tracking-widest">Payment Method</h2>
<div class="flex flex-col border-t border-b border-hairline">
<!-- Active Selection -->
<label class="flex items-center gap-4 py-6 border-l-2 border-primary pl-6 pr-4 cursor-pointer hover:bg-surface-container-low transition-colors group">
<input checked="" class="sr-only peer" name="payment_method" type="radio" value="paystack"/>
<span class="font-body-base text-body-base text-primary peer-checked:font-bold">Mobile Money / Card — via Paystack</span>
<span class="material-symbols-outlined ml-auto text-primary opacity-100" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<!-- Inactive Selection -->
<label class="flex items-center gap-4 py-6 border-l-2 border-transparent border-t border-hairline pl-6 pr-4 cursor-pointer hover:bg-surface-container-low transition-colors group">
<input class="sr-only peer" name="payment_method" type="radio" value="cod"/>
<span class="font-body-base text-body-base text-primary peer-checked:font-bold group-hover:text-primary">Cash on delivery</span>
<span class="material-symbols-outlined ml-auto text-outline-variant opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
</div>
</div>
</form>
</section>
<!-- Right Column: Sticky Order Summary (40%) -->
<aside class="w-full lg:w-2/5 relative">

<div class="flex flex-col flex-grow pt-1">

</div>
</div>
<!-- Product Item 2 -->
<div class="flex flex-row gap-6 items-start">
<img class="w-20 h-28 object-cover bg-image-plate" data-alt="A close-up, minimalist still life of a pair of tailored men's trousers in a muted olive tone, neatly folded on a stark white plinth. The composition is highly structured and geometric, illuminated by soft, high-key studio lighting. The overall mood is clinical yet premium, emphasizing the fabric's drape and the precise stitching, aligning with a high-end menswear catalog look." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCXcZ43wVTcEFP77KvI-yYa8lzn8hTaJWuCWiDTC3EdxDM8PLpeqO--hipnNhMgqIVCVnFwsCg49DNeqsTXxb3q_4NIY18fq0f3Nt4gKwv08QxcY6RIf-hvsIUuUZiXa5NazkeLFhUN_7cmrCA2uxOuZ2Qydd5cnAvsZQWpI8f5jF16xzcDHxBNIqB2pwLFCGHJihWSw_735TcyVYNez-KEKNVg45nrX1mQUZF1ixyLxicKM1GJ44BSFA"/>
<div class="flex flex-col flex-grow pt-1">
<span class="font-body-base text-body-base text-primary uppercase">Pleated Olive Trousers</span>
<span class="font-metadata-label text-metadata-label text-secondary mt-1">Size: 32</span>
<span class="font-data-mono text-data-mono text-primary mt-auto pt-4">GH₵ 350.00</span>
</div>
</div>
</div>
<!-- Totals Calculation -->
<div class="flex flex-col gap-4 border-b border-hairline pb-8">
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-secondary">Subtotal</span>
<span class="font-data-mono text-data-mono text-primary">GH₵ 1,200.00</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-secondary">Delivery</span>
<span class="font-data-mono text-data-mono text-primary">GH₵ 40.00</span>
</div>
</div>
<!-- Final Total -->
<div class="flex justify-between items-end pb-4">
<span class="font-body-base text-body-base uppercase tracking-widest text-primary">Total</span>
<span class="font-data-mono text-data-mono text-primary text-lg">GH₵ 1,240.00</span>
</div>
<!-- CTA Button -->
<button class="w-full bg-primary text-on-primary py-5 px-6 font-metadata-label text-metadata-label uppercase tracking-widest flex justify-center items-center gap-2 hover:opacity-80 transition-opacity rounded-none border border-primary" type="button">
                        PAY GH₵ 1,240.00
                        <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<p class="font-metadata-label text-metadata-label text-outline text-center mt-2 lowercase">Payments are securely processed via Paystack.</p>
</div>
</aside>
</div>
</main>
<script>
        // Micro-interaction for handling radio button selection styling
        document.addEventListener('DOMContentLoaded', () => {
            const paymentRadios = document.querySelectorAll('input[name="payment_method"]');
            
            paymentRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Reset all borders and icons
                    paymentRadios.forEach(r => {
                        const label = r.closest('label');
                        const icon = label.querySelector('.material-symbols-outlined');
                        label.classList.remove('border-primary');
                        label.classList.add('border-transparent');
                        icon.classList.remove('text-primary');
                        icon.classList.add('text-outline-variant');
                        icon.classList.remove('opacity-100');
                        icon.classList.add('opacity-0');
                        label.querySelector('span:first-of-type').classList.remove('font-bold');
                    });

                    // Set active state
                    if (e.target.checked) {
                        const activeLabel = e.target.closest('label');
                        const activeIcon = activeLabel.querySelector('.material-symbols-outlined');
                        activeLabel.classList.add('border-primary');
                        activeLabel.classList.remove('border-transparent');
                        activeIcon.classList.add('text-primary');
                        activeIcon.classList.remove('text-outline-variant');
                        activeIcon.classList.add('opacity-100');
                        activeIcon.classList.remove('opacity-0');
                        activeLabel.querySelector('span:first-of-type').classList.add('font-bold');
                    }
                });
            });
        });
    </script>
