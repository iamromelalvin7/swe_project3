<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        /* Base Styles ensuring editorial feel */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Minimalist Input Styles */
        input:focus {
            outline: none !important;
            box-shadow: none !important;
            border-color: #000000 !important;
        }
        input::placeholder {
            color: #ccc6bb; /* secondary-fixed-dim */
        }
        select:focus {
            outline: none !important;
            box-shadow: none !important;
            border-color: #000000 !important;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col relative pb-24 md:pb-0">
<!-- Top Navigation for Context, simplified for checkout -->
<header class="w-full top-0 sticky bg-background border-b border-hairline flex justify-between items-center px-margin-mobile py-4 w-full md:px-margin-desktop z-40">
<a aria-label="Go back" href="#">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back" data-weight="regular">arrow_back</span>
</a>
<h1 class="font-display-lg-mobile text-display-lg-mobile uppercase tracking-tighter text-primary">Archive 233</h1>
<div class="w-6"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow w-full max-w-3xl mx-auto px-margin-mobile py-8 md:px-margin-desktop md:py-16">
<!-- Page Title -->
<h2 class="font-headline-md text-headline-md mb-12 tracking-tight">CHECKOUT</h2>
<form action="#" class="space-y-12" method="POST">
<!-- Customer Information Section -->
<section class="space-y-8 border-b border-hairline pb-12">
<h3 class="font-metadata-label text-metadata-label uppercase text-secondary tracking-widest mb-6">Customer Information</h3>
<div class="space-y-2">
<label class="block font-metadata-label text-metadata-label uppercase text-on-surface" for="fullName">Full Name</label>
<input class="w-full bg-transparent border-0 border-b border-hairline px-0 py-3 font-data-mono text-data-mono text-on-surface focus:ring-0 transition-colors duration-200 uppercase" id="fullName" name="fullName" placeholder="ENTER YOUR FULL NAME" required="" type="text"/>
</div>
<div class="space-y-2">
<label class="block font-metadata-label text-metadata-label uppercase text-on-surface" for="phoneNumber">Phone Number</label>
<input class="w-full bg-transparent border-0 border-b border-hairline px-0 py-3 font-data-mono text-data-mono text-on-surface focus:ring-0 transition-colors duration-200" id="phoneNumber" name="phoneNumber" placeholder="+233" required="" type="tel"/>
</div>
</section>
<!-- Delivery Details Section -->
<section class="space-y-8 border-b border-hairline pb-12">
<h3 class="font-metadata-label text-metadata-label uppercase text-secondary tracking-widest mb-6">Delivery Details</h3>
<div class="space-y-2">
<label class="block font-metadata-label text-metadata-label uppercase text-on-surface" for="deliveryAddress">Delivery Address</label>
<input class="w-full bg-transparent border-0 border-b border-hairline px-0 py-3 font-data-mono text-data-mono text-on-surface focus:ring-0 transition-colors duration-200 uppercase" id="deliveryAddress" name="deliveryAddress" placeholder="STREET ADDRESS / BUILDING" required="" type="text"/>
</div>
<div class="space-y-2 relative">
<label class="block font-metadata-label text-metadata-label uppercase text-on-surface" for="deliveryZone">Delivery Zone</label>
<select class="w-full bg-transparent border-0 border-b border-hairline px-0 py-3 font-data-mono text-data-mono text-on-surface focus:ring-0 transition-colors duration-200 appearance-none uppercase cursor-pointer" id="deliveryZone" name="deliveryZone" required="">
<option disabled="" selected="" value="">SELECT A ZONE</option>
<option value="accra-central">ACCRA CENTRAL</option>
<option value="east-legon">EAST LEGON</option>
<option value="cantonments">CANTONMENTS</option>
<option value="osu">OSU</option>
<option value="other">OTHER (CONTACT FOR QUOTE)</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pt-6">
<span class="material-symbols-outlined text-primary" data-icon="expand_more">expand_more</span>
</div>
</div>
</section>
<!-- Payment Method Section -->
<section class="space-y-6 border-b border-hairline pb-12">
<h3 class="font-metadata-label text-metadata-label uppercase text-secondary tracking-widest mb-6">Payment Method</h3>
<!-- Option 1: Active -->
<label class="block relative cursor-pointer group">
<input checked="" class="peer sr-only" name="paymentMethod" type="radio" value="mobile-money"/>
<div class="w-full flex items-center justify-between p-4 border-l border-hairline peer-checked:border-l-[3px] peer-checked:border-primary peer-checked:bg-surface-container-low transition-all duration-200 bg-transparent">
<span class="font-data-mono text-data-mono text-on-surface uppercase">Mobile Money</span>
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity duration-200" data-icon="check">check</span>
</div>
</label>
<!-- Option 2: Inactive -->
<label class="block relative cursor-pointer group">
<input class="peer sr-only" name="paymentMethod" type="radio" value="card"/>
<div class="w-full flex items-center justify-between p-4 border-l border-hairline peer-checked:border-l-[3px] peer-checked:border-primary peer-checked:bg-surface-container-low transition-all duration-200 bg-transparent">
<span class="font-data-mono text-data-mono text-on-surface uppercase">Credit / Debit Card</span>
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity duration-200" data-icon="check">check</span>
</div>
</label>
</section>
<!-- Order Summary Section -->
<section class="space-y-4 pt-4">
<h3 class="font-metadata-label text-metadata-label uppercase text-secondary tracking-widest mb-6">Order Summary</h3>
<div class="flex justify-between items-center py-2">
<span class="font-body-base text-body-base text-on-surface">Subtotal</span>
<span class="font-data-mono text-data-mono text-on-surface">GH₵ 1,200.00</span>
</div>
<div class="flex justify-between items-center py-2">
<span class="font-body-base text-body-base text-on-surface">Delivery Estimate</span>
<span class="font-data-mono text-data-mono text-on-surface">GH₵ 40.00</span>
</div>
<div class="flex justify-between items-center py-4 border-t border-hairline mt-4">
<span class="font-body-base text-body-base font-bold text-on-surface">Total</span>
<span class="font-data-mono text-data-mono font-bold text-on-surface">GH₵ 1,240.00</span>
</div>
</section>
</form>
</main>
<!-- Sticky Footer for Checkout Action -->
<footer class="fixed bottom-0 w-full z-50 bg-background border-t border-hairline px-margin-mobile py-4 md:px-margin-desktop">
<div class="max-w-3xl mx-auto">
<button class="w-full bg-primary text-on-primary py-4 font-body-sm text-body-sm uppercase tracking-widest hover:opacity-90 transition-opacity duration-200 flex justify-center items-center gap-2" type="button">
                PAY GH₵ 1,240.00
                <span class="material-symbols-outlined text-on-primary text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
<!-- Note: BottomNavBar is intentionally suppressed as this is a linear/transactional checkout flow, prioritizing the sticky payment footer. -->
</body></html>
